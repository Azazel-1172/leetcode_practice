<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeetCode 每日挑戰</title>
<meta name="theme-color" content="#2f6fe4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="topbar-row">
      <button class="back" id="back" hidden>← 返回總覽</button>
      <h1 class="brand">LeetCode 每日挑戰</h1>
      <span class="stats" id="stats"></span>
      <span class="spacer"></span>
      <input class="search" id="search" type="search" placeholder="搜尋題號、題名、標籤…">
    </div>

    <div class="pills" id="filters">
      <button class="pill" data-filter="status">狀態</button>
      <button class="pill" data-filter="diff">難度</button>
      <button class="pill" data-filter="tags">標籤</button>
      <button class="pill-clear" id="clearFilters" hidden>清除</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="tag-hero" id="tagHero" hidden>
    <button class="hero-back" id="heroBack">← 全部題目</button>
    <div class="hero-icon" id="heroIcon"></div>
    <h2 class="hero-name" id="heroName"></h2>
    <div class="hero-sub" id="heroSub"></div>
  </section>
  <div class="qlist" id="grid"></div>
  <div class="empty" id="empty" hidden>沒有符合條件的題目</div>

  <section class="detail" id="detail">
    <div class="detail-head">
      <span class="qid" id="dQid"></span>
      <span class="badge" id="dDiff"></span>
      <span class="stats" id="dDate"></span>
      <span class="spacer"></span>
      <a id="dLink" href="#" target="_blank" rel="noopener">在 LeetCode 開啟 ↗</a>
      <button class="back edit-only" id="reveal">開啟資料夾</button>
    </div>
    <h1 id="dTitle"></h1>
    <div class="stats" id="dTitleEn"></div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-panel="p-problem" aria-selected="true">題目</button>
      <button class="tab" role="tab" data-panel="p-notes" aria-selected="false">筆記與標籤</button>
      <button class="tab" role="tab" data-panel="p-interview" aria-selected="false">面試官問答</button>
      <button class="tab" role="tab" data-panel="p-code" aria-selected="false">解答檔</button>
    </div>

    <div class="panel on prose" id="p-problem"></div>

    <div class="panel" id="p-notes">
      <div class="prose static-only" id="notesView"></div>
      <div class="editor edit-only">
        <div class="field">
          <span class="label">狀態</span>
          <div class="seg" id="statusEdit">
            <button data-status="todo">⬜ 未解</button>
            <button data-status="wip">🟡 進行中</button>
            <button data-status="done">✅ 已解</button>
          </div>
        </div>

        <div class="field">
          <span class="label">我的標籤</span>
          <div class="taginput" id="tagBox">
            <input id="tagInput" placeholder="輸入後按 Enter 新增">
          </div>
          <span class="label">官方分類：<span id="officialTags"></span></span>
          <div class="suggest" id="suggest"></div>
        </div>

        <div class="field">
          <span class="label">解題筆記（Markdown，會寫回該題的 README.md）</span>
          <textarea id="notes" spellcheck="false"></textarea>
        </div>

        <div class="row">
          <button class="btn" id="save">儲存</button>
          <button class="btn ghost" id="revert">還原</button>
          <span class="label" id="saveHint"></span>
        </div>
      </div>
    </div>

    <div class="panel" id="p-interview">
      <div class="prose" id="interviewView"></div>
      <details class="editor edit-only" id="interviewEdit" style="margin-top:20px">
        <summary class="label" style="cursor:pointer">編輯這一區（Markdown）</summary>
        <div class="field" style="margin-top:12px">
          <textarea id="interview" spellcheck="false"></textarea>
        </div>
        <div class="row">
          <button class="btn" id="saveInterview">儲存</button>
          <span class="label" id="interviewHint"></span>
        </div>
      </details>
    </div>

    <div class="panel" id="p-code"></div>
  </section>
</main>

<div class="sheet-backdrop" id="sheetBackdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
